services:
  mongodb:
    image: mongo:latest
    container_name: v27_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: v27_fastapi_backend
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
    restart: unless-stopped
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: v27_react_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  mongo_data:
